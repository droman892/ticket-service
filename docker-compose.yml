services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticket_service
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ticket_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_service -d ticket_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
