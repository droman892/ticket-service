[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-service"
version = "0.1.0"
description = "Authenticated FastAPI + PostgreSQL backend for managing support tickets (agents/admins, CSV bulk import, summaries)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Roman" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

# This is an application run from a clone of the repository
# (uvicorn src.main:app), not a library, so there is nothing to package.
# The empty list makes `pip install -e ".[dev]"` install only the
# dependencies above.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"
asyncio_mode = "auto"

# mypy is configured in mypy.ini.
